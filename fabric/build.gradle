plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom'
}

base {
    archivesName = "${rootProject.mod_id}-fabric"
}

sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')
sourceSets.test.java.srcDir rootProject.file('common/src/test/java')

loom {
    mods {
        "${rootProject.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Minecraft 26.1 ships unobfuscated under Mojang's official names; Loom rejects a remapping layer.
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

def expandedModVersion = rootProject.mod_version

def expandedMinecraftVersion = rootProject.minecraft_version

def expandedLoaderVersion = rootProject.fabric_loader_version

processResources {
    inputs.property 'version', expandedModVersion
    inputs.property 'minecraft_version', expandedMinecraftVersion
    inputs.property 'loader_version', expandedLoaderVersion
    filesMatching('fabric.mod.json') {
        expand(
            version: expandedModVersion,
            minecraft_version: expandedMinecraftVersion,
            loader_version: expandedLoaderVersion
        )
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${rootProject.mod_id}-fabric"
            from components.java
        }
    }
}
