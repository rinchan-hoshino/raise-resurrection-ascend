plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
}

def root = rootProject

def modId = root.property('mod_id')

base {
    archivesName = "${modId}-neoforge"
}

sourceSets.main.java.srcDir root.file('common/src/main/java')
sourceSets.main.resources.srcDir root.file('common/src/main/resources')
sourceSets.test.java.srcDir root.file('common/src/test/java')

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('test') {
    useJUnitPlatform()
}

sourceSets.main.resources.srcDir tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version_range: root.minecraft_version_range,
        neo_version_range      : root.neo_version_range,
        loader_version_range   : root.loader_version_range,
        mod_id                 : modId,
        mod_name               : root.mod_name,
        mod_license            : root.mod_license,
        mod_version            : root.mod_version,
        mod_authors            : root.mod_authors,
        mod_description        : root.mod_description
    ]
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

neoForge {
    version = root.neo_version
    mods {
        "${modId}" {
            sourceSet(sourceSets.main)
        }
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

neoForge.ideSyncTask tasks.named('generateModMetadata')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${modId}-neoforge"
            from components.java
        }
    }
}
